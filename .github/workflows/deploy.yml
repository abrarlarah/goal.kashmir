name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install Frontend Dependencies
        run: npm install
        
      - name: Run Unit Tests
        run: npm run test:run

      - name: Build Frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCyH8h0OqHmI3vXsW_ee1qugqCAHRiL3vk"
          VITE_FIREBASE_AUTH_DOMAIN: "soccer-app-e81d0.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "soccer-app-e81d0"
          VITE_FIREBASE_STORAGE_BUCKET: "soccer-app-e81d0.appspot.com"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "199836947592"
          VITE_FIREBASE_APP_ID: "1:199836947592:web:8388db5a944f98b6d57b3d"
          VITE_FIREBASE_MEASUREMENT_ID: "G-JQZVTJX6TJ"

      - name: Deploy to Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "FIREBASE_TOKEN secret is empty or missing! Skipping deployment from CI."
            echo "To fix this, run 'firebase login:ci' locally and update the FIREBASE_TOKEN secret in GitHub."
            exit 0
          fi
          npm install -g firebase-tools
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive || { echo "Deployment failed! Token might be expired."; exit 1; }
